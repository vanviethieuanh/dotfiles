set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'z3z1ma/tmux-gruvbox'
set -g @gruvbox_flavour 'dark'

set -g @gruvbox_status_modules_right 'session'
set -g @gruvbox_date_time_text '%d/%m/%Y %H:%M'
set -g @gruvbox_host_text '#h'
set -g @gruvbox_session_color '#ebdbb2'
set -g @gruvbox_session_icon ''

set -g @gruvbox_status_modules_right "session "
set -g @gruvbox_status_left_separator "█"
set -g @gruvbox_status_right_separator ""

set -g @gruvbox_window_left_separator "█"
set -g @gruvbox_window_right_separator "█ "
set -g @gruvbox_window_middle_separator " █"
set -g @gruvbox_window_number_position "right"
set -g @gruvbox_window_default_fill "number"
set -g @gruvbox_window_default_text "#W"

set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim 'session'

run '~/.tmux/plugins/tpm/tpm'

# ------------

set -g status-position top

set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Better colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -sg escape-time 50

# Large scrollback
set -g history-limit 100000

# Vim keys in copy mode
setw -g mode-keys vi

# Double-line pane borders for more visual padding
set -g pane-border-lines heavy 

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting
bind | split-window -h
bind - split-window -v

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Enable mouse
set -g mouse on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Easier window switching
bind -n M-h previous-window
bind -n M-l next-window

# Help menu
bind ? display-popup -E -w 80% -h 60% "tmux list-keys | fzf --reverse --prompt='Binding: '"
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind e display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "spf"
bind o display-popup -E -w 30% -h 50% "~/.config/scripts/open-repo-session.sh \$(ls ~/Repositories | fzf --reverse --prompt='Repository: ')"

# Reorder windows
bind -r > swap-window -d -t +1
bind -r < swap-window -d -t -1
