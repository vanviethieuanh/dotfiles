dark0_hard="#1d2021"
dark0="#282828"
dark0_soft="#32302f"
dark1="#3c3836"
dark2="#504945"
dark3="#665c54"
dark4="#7c6f64"
dark4_256="#7c6f64"

gray_245="#928374"
gray_244="#928374"

