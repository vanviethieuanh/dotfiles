set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'

# ------------
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Better colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -sg escape-time 50

# Large scrollback
set -g history-limit 100000

# Vim keys in copy mode
setw -g mode-keys vi


# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting
bind | split-window -h
bind - split-window -v

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Enable mouse
set -g mouse on

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Easier window switching
bind -n M-h previous-window
bind -n M-l next-window

# Help menu
bind ? display-popup -E -w 80% -h 60% "tmux list-keys | fzf --reverse --prompt='Binding: '"
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind e display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "spf"
bind o display-popup -E -w 30% -h 50% "~/.config/scripts/open-repo-session.sh \$(ls ~/Repositories | fzf --reverse --prompt='Repository: ')"

# Session management (paired with Ghostty Cmd+N / Cmd+Q)
bind C command-prompt -p "New session name:" "new-session -s '%%'"
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session

# Reorder windows
bind -r > swap-window -d -t +1
bind -r < swap-window -d -t -1

