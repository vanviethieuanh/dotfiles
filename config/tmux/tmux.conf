light0="#fbf1c7"
light0_soft="#f2e5bc"
light1="#ebdbb2"
light2="#d5c4a1"
light3="#bdae93"
light4="#a89984"
light4_256="#a89984"

bright_red="#fb4934"
bright_green="#b8bb26"
bright_yellow="#fabd2f"
bright_blue="#83a598"
bright_purple="#d3869b"
bright_aqua="#8ec07c"
bright_orange="#fe8019"

neutral_red="#cc241d"
neutral_green="#98971a"
neutral_yellow="#d79921"
neutral_blue="#458588"
neutral_purple="#b16286"
neutral_aqua="#689d6a"
neutral_orange="#d65d0e"

faded_red="#9d0006"
faded_green="#79740e"
faded_yellow="#b57614"
faded_blue="#076678"
faded_purple="#8f3f71"
faded_aqua="#427b58"
faded_orange="#af3a03"

set -g status-position top
set -g status-left-length 60
set -g status-style "fg=${light3},bg=${dark0_hard}"
set -g status-left " #[fg=${bright_aqua},bold] #S #[fg=${dark2}]│ "
set -g status-right ""

set -g window-status-current-format "#[fg=${bright_yellow},bold][#I] #W #[fg=${light4}]"
set -g window-status-format "#[fg=${light4}]#I-#W #[fg=${light4}]"

set -g message-style "fg=${dark2},bg=${light0_soft}"
set -g mode-style "fg=${dark0_hard},bg=${bright_blue}"

set -g pane-border-style "fg=${light4}"
set -g pane-active-border-style "fg=${light1}"
set -g pane-border-lines single
