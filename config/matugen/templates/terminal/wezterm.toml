# Generated by matugen
# WezTerm color scheme
# DO NOT EDIT

[colors]
foreground = "{{ colors.on_surface.default.hex }}"
background = "{{ colors.surface.default.hex }}"

cursor_bg = "{{ colors.secondary.default.hex }}"
cursor_fg = "{{ colors.surface.default.hex }}"
cursor_border = "{{ colors.secondary.default.hex }}"

selection_bg = "{{ colors.secondary_fixed_dim.default.hex }}"
selection_fg = "{{ colors.on_secondary.default.hex }}"

scrollbar_thumb = "{{ colors.outline.default.hex }}"
split = "{{ colors.outline_variant.default.hex }}"

ansi = [
  "{{ colors.surface_dim.default.hex }}",        # black
  "{{ colors.error.default.hex }}",              # red
  "{{ colors.primary.default.hex }}",            # green
  "{{ colors.tertiary.default.hex }}",           # yellow
  "{{ colors.secondary.default.hex }}",          # blue
  "{{ colors.tertiary_container.default.hex }}", # magenta
  "{{ colors.secondary_container.default.hex }}",# cyan
  "{{ colors.on_surface.default.hex }}",         # white
]

brights = [
  "{{ colors.surface_bright.default.hex }}",     # bright black
  "{{ colors.error_container.default.hex }}",    # bright red
  "{{ colors.primary_container.default.hex }}",  # bright green
  "{{ colors.tertiary_fixed.default.hex }}",     # bright yellow
  "{{ colors.secondary_fixed.default.hex }}",    # bright blue
  "{{ colors.tertiary_fixed_dim.default.hex }}", # bright magenta
  "{{ colors.secondary_fixed_dim.default.hex }}",# bright cyan
  "{{ colors.on_surface_variant.default.hex }}", # bright white
]

[colors.indexed]
16 = "{{ colors.inverse_primary.default.hex }}"
17 = "{{ colors.tertiary.default.hex }}"
18 = "{{ colors.surface_container_low.default.hex }}"
19 = "{{ colors.surface_container.default.hex }}"
20 = "{{ colors.surface_container_high.default.hex }}"
21 = "{{ colors.surface_container_highest.default.hex }}"

[metadata]
name = "Matugen Material"
author = "matugen"
origin_url = "https://github.com/InioX/matugen"
