# https://taskfile.dev

version: "3"

vars:
  WALLPAPER: /home/accodius/Downloads/wallhaven-6d6xwl.jpg

tasks:
  install-fonts:
    cmds:
      - cp ./ZhiMangXing-Regular.ttf ~/.local/share/fonts/

  install:
    vars:
      PACMAN: >
        cargo
        hyprland
        hyprpaper
        hyprshot
        hyprsunset
        pavucontrol
        rofi
        swaync
        uwsm
        waybar
        wev
      YAY: >
        awww-git
        vicinae-bin
      CARGO: >
        https://github.com/elkowar/eww
        https://github.com/vanviethieuanh/lunis
    cmds:
      - sudo pacman -S --needed {{.PACMAN}}
      - yay -S --needed --noconfirm --removemake {{.YAY}}

  link-wallpaper:
    internal: true
    cmds:
      - for:
          - config/rofi
        cmd: ln -sf {{.WALLPAPER}} "$(realpath {{.ITEM}})/.current_wallpaper"

  link-file:
    internal: true
    cmds:
      - for:
          - .gitconfig
          - .p10k.zsh
          - .zshrc
        cmd: ln -sf "$(realpath {{.ITEM}})" "$(realpath ~)/{{.ITEM}}"

  link-config-d:
    internal: true
    vars:
      DIRS:
        sh: ls config
    cmds:
      - for: { var: DIRS }
        cmd: |
          rm -rf "$(realpath ~)/.config/{{.ITEM}}"
          ln -sf "$(realpath config/{{.ITEM}})" "$(realpath ~)/.config/{{.ITEM}}"

  link:
    desc: Create symbolic links from repo to actually config location
    deps:
      - link-file
      - link-config-d
      - link-wallpaper

  allow-x-all:
    desc: Allow all scripts in config to execute
    silent: true
    cmds:
      - echo "The following files will be modified:"
      - find . -type f -name "*.sh"
      - sudo -v
      - read -p "Continue? [y/N] " ans && [ "$ans" = "y" ]
      - sudo find . -type f -name "*.sh" -exec chmod +x {} +

  get-btop-theme:
    desc: Get btop themes
    cmds:
      - git clone https://github.com/aristocratos/bpytop.git /tmp/bpytop --depth=1
      - mkdir -p "$HOME/.config/btop/themes"
      - cp -r /tmp/bpytop/themes/* "$HOME/.config/btop/themes"
      - rm -rf /tmp/bpytop

  restart-waybar:
    cmd: pkill -SIGUSR2 waybar

  restart-swaync:
    cmds:
      - swaync-client -R
      - swaync-client -rs

  speed-test-nvim:
    cmds:
      - rm /tmp/startuptime.log
      - nvim --startuptime /tmp/startuptime.log ~/Repositories/unitd +qa
      - cat /tmp/startuptime.log
